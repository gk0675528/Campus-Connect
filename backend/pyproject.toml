[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Pathzeo"
version = "1.0.0"
description = "Pathzeo mentorship and career guidance platform"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Pathzeo Team"}
]

[project.urls]
Homepage = "https://github.com/gk0675528/Campus-Connect"
Repository = "https://github.com/gk0675528/Campus-Connect"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "database*", "integrations*", "modules*", "monitoring*", "storage*", "websocket*"]

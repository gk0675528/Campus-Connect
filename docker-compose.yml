version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: campusconnect-db
    environment:
      POSTGRES_USER: campusconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: campusconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusconnect -d campusconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campusconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: campusconnect-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: campusconnect-api

    command: python main.py

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://campusconnect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/campusconnect
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: campusconnect
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: Pathzeo
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY before starting the API}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy

    volumes:
      - ./backend:/app

    restart: unless-stopped


volumes:
  postgres_data:
  redis_data:
  mongodb_data:


networks:
  default:
    name: campusconnect-network

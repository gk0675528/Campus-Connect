<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Center — CampusConnect</title>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a href="dashboard.html" class="sidebar-brand">
          <img src="assets/logos/logo.svg" alt="CampusConnect" class="sidebar-brand-img">
        </a>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-section-title">Main Menu</span>
        <a href="dashboard.html" class="nav-item-link" id="nav-dashboard">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a href="mentors.html" class="nav-item-link" id="nav-mentors">
          <i class="bi bi-search"></i>
          <span>Find Mentors</span>
        </a>
        <a href="bookings.html" class="nav-item-link" id="nav-bookings">
          <i class="bi bi-calendar2-check"></i>
          <span>My Sessions</span>
        </a>
        <a href="messages.html" class="nav-item-link" id="nav-messages">
          <i class="bi bi-chat-dots"></i>
          <span>Messages</span>
        </a>
        <a href="communities.html" class="nav-item-link" id="nav-communities">
          <i class="bi bi-people"></i>
          <span>Communities</span>
        </a>
        <a href="notifications.html" class="nav-item-link active" id="nav-notifications">
          <i class="bi bi-bell"></i>
          <span>Notifications</span>
        </a>
        <a href="payments.html" class="nav-item-link" id="nav-payments">
          <i class="bi bi-credit-card"></i>
          <span>Payments</span>
        </a>
        <a href="profile.html" class="nav-item-link" id="nav-profile">
          <i class="bi bi-person"></i>
          <span>My Profile</span>
        </a>
        <a href="settings.html" class="nav-item-link" id="nav-settings">
          <i class="bi bi-gear"></i>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
            <div class="sidebar-user-role" id="sidebar-user-role">Student</div>
          </div>
          <button type="button" class="btn btn-icon-sm btn-outline-secondary logout-btn" title="Sign Out">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="d-flex align-items-center gap-3">
          <button type="button" class="btn btn-icon d-lg-none" id="sidebar-toggle-btn">
            <i class="bi bi-list fs-4"></i>
          </button>
          <h4 class="font-heading fw-bold mb-0 text-dark">Notification Center</h4>
        </div>

        <div class="topbar-actions">
          <div class="dropdown">
            <button class="btn btn-outline-secondary d-flex align-items-center gap-2 py-1 px-2.5 rounded-pill" data-bs-toggle="dropdown">
              <div class="topbar-user-avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold small" style="width: 28px; height: 28px;" id="topbar-user-avatar">U</div>
              <span class="d-none d-sm-inline fw-semibold small text-dark topbar-user-name" id="topbar-user-name">Account</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2">
              <li><a class="dropdown-item small py-2" href="profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
              <li><hr class="dropdown-divider my-1"></li>
              <li><a class="dropdown-item small py-2 text-danger logout-btn" href="#"><i class="bi bi-box-arrow-right me-2"></i>Sign Out</a></li>
            </ul>
          </div>
        </div>
      </header>

      <main class="app-content">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h3 class="font-heading fw-bold text-dark mb-1">Your Updates</h3>
            <p class="text-secondary small mb-0">Booking updates, new messages, and community activity.</p>
          </div>

          <!-- Filter Tabs -->
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-outline-secondary btn-sm notif-filter-tab active" data-filter="all">All</button>
            <button type="button" class="btn btn-outline-secondary btn-sm notif-filter-tab" data-filter="unread">Unread Only</button>
          </div>
        </div>

        <!-- Notifications Container -->
        <div class="cc-card p-0 overflow-hidden shadow-sm" id="notifications-list-container">
          <!-- Dynamically populated via js/notifications.js -->
        </div>
      </main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <div class="mobile-bottom-nav">
    <a href="dashboard.html" class="mobile-nav-item">
      <i class="bi bi-speedometer2"></i>
      <span>Home</span>
    </a>
    <a href="mentors.html" class="mobile-nav-item">
      <i class="bi bi-search"></i>
      <span>Mentors</span>
    </a>
    <a href="bookings.html" class="mobile-nav-item">
      <i class="bi bi-calendar2-check"></i>
      <span>Sessions</span>
    </a>
    <a href="messages.html" class="mobile-nav-item">
      <i class="bi bi-chat-dots"></i>
      <span>Messages</span>
    </a>
    <a href="profile.html" class="mobile-nav-item">
      <i class="bi bi-person"></i>
      <span>Profile</span>
    </a>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
</body>
</html>
